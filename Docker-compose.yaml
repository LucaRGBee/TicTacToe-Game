services:
  nginx:
    build: ./src/web/
    image: nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - django
  django:
    build: ./src/api/
    image: django
    container_name: django
    expose:
      - "8000"
    depends_on:
      - "db"
  db:
    image: postgres:latest
    container_name: db
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - ./database:/var/lib/postgresql/